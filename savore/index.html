<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    
    <meta
    name="description"
    content="SAVORE is a modern dining experience where exceptional cuisine, elegant atmosphere, and unforgettable flavors come together."
    />
    
    <meta
    name="keywords"
    content="SAVORE, restaurant, fine dining, modern restaurant, gourmet food, dining experience, cuisine"
    />
    
    <meta name="author" content="SAVORE" />
    
    <!-- Search Engine Instructions -->
    <meta name="robots" content="index, follow" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#171512" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://your-domain.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    
    <meta
    property="og:title"
    content="SAVORE | Modern Dining & Exceptional Cuisine"
    />
    
    <meta
    property="og:description"
    content="Discover exceptional cuisine, elegant atmosphere, and unforgettable flavors at SAVORE."
    />
    
    <meta
    property="og:image"
    content="https://your-domain.com/images/savore-og-image.jpg"
    />
    
    <meta property="og:url" content="https://your-domain.com/" />
    
    <meta property="og:site_name" content="SAVORE" />
    
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    
    <meta
    name="twitter:title"
    content="SAVORE | Modern Dining & Exceptional Cuisine"
    />
    
    <meta
    name="twitter:description"
    content="Experience exceptional cuisine and unforgettable dining at SAVORE."
    />
    
    <meta
    name="twitter:image"
    content="https://your-domain.com/images/savore-og-image.jpg"
    />
    
    <!-- Accessibility -->
    <meta
    name="color-scheme"
    content="light dark"
    />
    
    <!-- Preconnect for External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
    />
    <title>SAVORE | Modern Dining & Exceptional Cuisine</title>
  </head>

  <body>

    <!-- React Application -->
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
